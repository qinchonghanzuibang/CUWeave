services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuweave}
      POSTGRES_USER: ${POSTGRES_USER:-cuweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuweave-local-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - cuweave-postgres:/var/lib/postgresql/data

volumes:
  cuweave-postgres:
