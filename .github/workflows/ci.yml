name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:65432/unreachable
      BETTER_AUTH_SECRET: ci-build-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint:ts
      - run: pnpm typecheck
      - run: pnpm test:ts
      - run: pnpm deploy:validate
      - run: pnpm build

  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  migrations:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cuweave
          POSTGRES_USER: cuweave
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuweave -d cuweave"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cuweave:ci-only@127.0.0.1:5432/cuweave
      CUWEAVE_TEST_DATABASE_URL: postgresql://cuweave:ci-only@127.0.0.1:5432/cuweave
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: git diff --exit-code -- packages/db/drizzle
      - run: pnpm db:migrate
      - run: pnpm --filter @cuweave/db db:validate
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: services/ingest
      - run: uv run pytest tests/test_importer.py
        working-directory: services/ingest
        env:
          CUWEAVE_TEST_DATABASE_URL: postgresql://cuweave:ci-only@127.0.0.1:5432/cuweave
      - run: pnpm --filter @cuweave/db test

  e2e:
    name: Focused public beta Web flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cuweave
          POSTGRES_USER: cuweave
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuweave -d cuweave"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cuweave:ci-only@127.0.0.1:5432/cuweave
      AUTH_DEV_MODE: 'true'
      BETTER_AUTH_SECRET: ci-playwright-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/ingest
      - run: pnpm db:migrate
      - run: >-
          uv run cuweave-ingest import tests/fixtures/synthetic-subject.json
          --manifest tests/fixtures/synthetic-manifest.json
        working-directory: services/ingest
      - run: pnpm dev:seed
      - run: pnpm requirements:seed
      - run: pnpm --filter @cuweave/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
