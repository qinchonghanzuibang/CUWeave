[project]
name = "cuweave-ingest"
version = "0.1.0"
description = "CUWeave data-ingestion service foundation"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["pydantic>=2.12.0,<3"]

[project.scripts]
cuweave-ingest = "cuweave_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.0,<10", "ruff>=0.14.0,<0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuweave_ingest"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
